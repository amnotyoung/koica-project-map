<!doctype html>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  /* 슬라이드 한 장 = 13.333in × 7.5in (16:9). Chrome PDF 출력 크기와 일치시킨다. */
  @page { size: 13.333in 7.5in; margin: 0; }
  html, body { margin: 0; padding: 0; background: #7a7a7a; }
  .sheet {
    width: 13.333in; height: 7.5in; background: #fff;
    margin: 0 auto; position: relative; overflow: hidden;
  }
  svg { display: block; width: 100%; height: 100%; }
  text { font-family: "맑은 고딕", "Malgun Gothic", "Apple SD Gothic Neo",
         "Noto Sans KR", sans-serif; white-space: pre; }
  /* 시트가 뷰포트를 정확히 채워야 스크린샷이 슬라이드와 1:1 로 맞는다.
     여백을 주면 캡처가 잘리거나 가운데로 몰린다. */
  @media print { body { background: #fff; } .sheet { margin: 0; } }
</style>
<div class="sheet">
{{SVG}}
</div>
