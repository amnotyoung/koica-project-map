<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KOICA 프로젝트맵 · 사업 목록 검토</title>
<style>
:root{--ink:#192d3b;--navy:#123f61;--muted:#516675;--line:#d7e0e3;--tint:#edf4f4;--bg:#f4f6f7;--notice:#8b491a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Apple SD Gothic Neo","맑은 고딕",sans-serif}
header{background:var(--navy);color:#fff;border-bottom:5px solid #69aaac}header>div,main{max-width:1190px;margin:auto;padding:23px 28px}
header>div,.line,.tools,.filters,.actions,.sources{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}h1{font-size:26px;margin:2px 0;font-weight:750}
header small{color:#d1e3ec}button,select,input{font:inherit}button,select{cursor:pointer}button{border:1px solid #bccbd2;background:white;border-radius:6px;color:var(--ink);padding:7px 13px}
button:hover{background:var(--tint)}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #2392b1;outline-offset:1px}.primary{background:#fff;color:var(--navy);font-weight:750}
.tools{margin:17px 0}.filters{gap:0;border:1px solid #bccbd2;border-radius:6px;overflow:hidden}.filters button{border:0;border-radius:0}.filters button[aria-pressed=true]{color:white;background:var(--navy)}
input[type=text],input[type=search],select{background:#fff;border:1px solid #cbd5db;border-radius:5px;padding:7px 9px;color:var(--ink);width:100%}#search{width:190px}#status{color:var(--muted);margin:0}.alert{color:var(--notice)}
.rows{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}.row{display:grid;grid-template-columns:77px minmax(0,1fr) minmax(150px,22%);gap:18px;padding:16px 18px;border-bottom:1px solid var(--line)}.row:last-child{border:0}.toggle{display:flex;align-items:center;gap:4px;font-weight:650}.toggle input{width:17px;height:17px;accent-color:var(--navy)}
.tag,.hint,label.caption,summary,.extra label{font-size:12px;color:var(--muted)}.tag{color:var(--notice);font-weight:700}.sources{gap:9px;font-size:13px;margin-top:6px}a{color:#125775}.hint{margin:4px 0}.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}.badges label{font-size:12px;cursor:pointer}.badges input{accent-color:var(--navy)}details{margin-top:6px}summary{cursor:pointer}.extra{background:#f6f8f9;padding:10px;border-radius:5px;margin-top:5px}.extra input{margin-bottom:6px}
label.caption{display:block;margin-bottom:4px}.empty{padding:32px;text-align:center;color:var(--muted)}#feedback{margin-left:8px}#feedback.error{color:#a23419}#restore{display:none}footer{margin:13px 0 40px;color:var(--muted);font-size:13px}.sub{font-size:12px;color:var(--muted)}
@media(max-width:720px){main,header>div{padding:15px}.row{grid-template-columns:62px 1fr;gap:10px}.location{grid-column:2}.tools{align-items:stretch}.filters button{padding:6px 8px}h1{font-size:21px}}

#location-panel{grid-column:1/-1;border:1px solid #c5d6d9;border-radius:7px;padding:12px;background:#f6faf9}
#location-controls{display:grid;grid-template-columns:minmax(220px,2fr) minmax(160px,1fr);gap:12px}
#location-controls[hidden],#location-panel[hidden]{display:none}
#geo-map{width:100%;height:clamp(220px,31vh,340px);display:block;background:#e7eff0;touch-action:none;cursor:crosshair}
#geo-map .boundary{stroke:#98b0af;stroke-width:.65;vector-effect:non-scaling-stroke;fill:transparent}
#geo-map .selectable:hover{fill:#cbe3dd;cursor:pointer}#geo-map .chosen{fill:#f5cbba;stroke:#b74935;stroke-width:1.5}
#geo-map .pin{cursor:grab}#geo-map text{fill:#344e58;paint-order:stroke;stroke:#fff;stroke-width:2.5px;stroke-linejoin:round}
.map-tools{display:flex;gap:5px;align-items:center;margin-bottom:8px}.map-tools button{padding:3px 9px}
.map-choices label{display:block;font-size:13px;color:var(--muted);margin:3px 0 8px}
#geo-status{margin:6px 0 0;color:var(--navy)}#pin-coord{font-variant-numeric:tabular-nums}
@media(max-width:720px){#location-controls{grid-template-columns:1fr}#geo-map{height:230px}}
</style></head>
<body><header><div><div><small>KOICA 프로젝트맵</small><h1 id="heading"></h1></div><span class="grow"></span><span id="count"></span><button class="primary" id="save"></button></div></header>
<main><p id="status"></p><a id="official" class="sub" hidden target="_blank" rel="noopener noreferrer">KOICA 게시판 검색 결과 ↗</a><div class="tools"><div class="filters" aria-label="목록 필터"><button data-filter="all">전체</button><button data-filter="notice">공고 후보</button><button data-filter="included">지도에 포함</button></div><input type="search" id="search" aria-label="사업명 또는 지명 검색" placeholder="사업명·지명 검색"><span class="grow"></span><button id="add">+ 직접 추가</button><button id="load">저장 목록 열기</button><input id="restore" type="file" accept=".json,application/json"></div>
<div id="feedback" role="status"></div><div class="rows" id="rows"></div>
<datalist id="geo-citylist"></datalist><div id="geo-dock"><section id="location-panel" hidden aria-label="대상지 지도 미리보기">
<div class="map-tools"><strong>대상지 미리보기</strong><span class="grow"></span><button id="geo-close">닫기</button></div>
<div id="location-controls"><div><svg id="geo-map" viewBox="0 0 640 320" aria-label="대상지 지도"></svg><div class="map-tools"><button id="geo-plus" aria-label="지도 확대">＋</button><button id="geo-minus" aria-label="지도 축소">−</button><button id="geo-reset">국가 전체</button></div></div>
<div class="map-choices"><label>표시 방식<select id="geo-mode"><option value="site">지점 핀</option><option value="admin1">주 단위 권역 (ADM1)</option><option value="admin2">군 단위 권역 (ADM2)</option><option value="nationwide">국가 전역</option></select></label>
<div id="pin-controls"><label>이동할 핀<select id="pin-select"></select></label><span id="pin-coord"></span></div>
<div id="area-controls" hidden><input type="search" id="region-filter" placeholder="행정구역 검색" aria-label="행정구역 검색"><label>선택 또는 해제<select id="region-options" size="5"></select></label></div>
<small id="geo-year"></small></div></div><p id="geo-status" role="status"></p><small>Natural Earth · GeoNames · geoBoundaries</small></section></div>
<details><summary>국가 표기 수정</summary><div class="extra"><label>영문 국가명<input id="cen"></label><label>지역 탭<input id="reg"></label></div></details>
<footer id="help"></footer></main>
<script type="application/json" id="geo-data">__GEO_JSON__</script>
<script type="application/json" id="payload">__DRAFT_JSON__</script>
<script>
const HOSTED=__HOSTED__, $=id=>document.getElementById(id);
let data, rows, filter='all', seq=0;
const badges={E:'교육',H:'보건',G:'공공행정',A:'농림수산',T:'기술환경'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function webUrl(value){try{const u=new URL(value);return ['http:','https:'].includes(u.protocol)?u.href:null}catch{return null}}
function tell(msg,error=false){$('feedback').textContent=msg;$('feedback').className=error?'error':''}
function init(doc){
 if(!doc || typeof doc.country!=='string'||!Array.isArray(doc.projects))throw Error('국가와 사업 목록이 있는 JSON 파일을 선택하세요.');
 let entries=[...doc.projects,...(doc.notice_candidates||[]).map(p=>({...p,selected:false})),...(doc.review_excluded||[]).map(p=>({...p,selected:false}))];
 if(entries.some(p=>!p||typeof p.name_ko!=='string'))throw Error('사업명이 없는 레코드를 읽을 수 없습니다.');
 currentLocation=null;data=doc;rows=entries.map(p=>({...p,selected:p.selected!==false,_key:++seq,_originalPlace:p.place||''}));filter=doc.notice_candidates?.length?'notice':'all';$('search').value='';
 $('heading').textContent=[doc.country,doc.year,'사업 목록 검토'].filter(Boolean).join(' ');$('cen').value=doc.country_en||'';$('reg').value=doc.region||'';
 const s=doc.notice_search;const boardUrl=webUrl(s?.search_url);$('official').hidden=!boardUrl;if(boardUrl)$('official').href=boardUrl;const n=rows.filter(r=>r._notice_candidate).length;
 $('status').textContent=s?`KOICA 공고 후보 ${n}건 · ${(s.checked_at||'').slice(0,10)} 조회 · 게시판 ${s.pages}쪽 확인${s.limited?' · 검색 범위 제한':''}${s.stale?' · 이전 저장본 사용':''}${s.status==='failed'?' · 조회 실패':s.status==='partial'?' · 일부 조회 실패':''}. 후보는 원문을 확인하고 ‘포함’을 선택하세요.`:'지도에 표시할 사업을 선택하고 사업명과 지명을 수정하세요.';
 $('save').textContent=HOSTED?'__SAVE_LABEL__':'선택 목록 저장';$('help').textContent=HOSTED?'저장하면 선택한 사업과 수정 내용을 적용합니다.':'저장한 JSON으로 지도를 만들 수 있습니다. 다시 편집할 때는 ‘저장 목록 열기’를 누르세요.';
 draw();
}
function count(){const n=rows.filter(r=>r.selected).length;$('count').textContent=`포함 ${n}건`;if(HOSTED)$('save').disabled=!n;for(const b of document.querySelectorAll('[data-filter]'))b.setAttribute('aria-pressed',b.dataset.filter===filter)}
function draw(){
 const panel=$('location-panel');$('geo-dock').append(panel);panel.hidden=true;
 const q=$('search').value.trim().toLowerCase();
 const shown=rows.filter(r=>(filter==='all'||filter==='notice'&&r._notice_candidate||filter==='included'&&r.selected)&&(!q||[r.name_ko,r.place,r._notice_title].join(' ').toLowerCase().includes(q)));
 $('rows').innerHTML=shown.map(r=>{
 const links=[...new Set([...(r.scope_sources||[]),r._source_info?.url].map(webUrl).filter(Boolean))];
 return `<article class="row" data-key="${r._key}"><div><label class="toggle"><input type="checkbox" data-field="selected" ${r.selected?'checked':''}>포함</label><span class="tag">${r._notice_candidate?'공고 후보':r._added?'직접 추가':''}</span></div>
 <div><label class="caption">지도에 표시할 사업명 · 기간 · 금액<input type="text" data-field="name_ko" value="${esc(r.name_ko)}"></label>
 ${r._notice_title?`<div class="hint">공고명　${esc(r._notice_title)}</div>`:''}
 ${r._similar_project?`<div class="hint alert">기존 유사 사업　${esc(r._similar_project)}</div>`:''}
 <div class="sources">${links.map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${r._notice_candidate&&i===0?'KOICA 공고 원문':'근거 자료'+(links.length>1?' '+(i+1):'')} ↗</a>`).join('')}
 <span class="sub">${esc([r._detail_unavailable?'본문 조회 실패':'',r._stage,r._period|| (r._notice_candidate?'사업기간 확인 필요':'')].filter(Boolean).join(' · '))}</span></div>
 <details><summary>세부 정보${r._notice_candidate?'·근거 문구':''}</summary><div class="extra">${r._notice_evidence?`<p class="hint">${esc(r._notice_evidence)}</p>`:''}<label>영문 사업명<input type="text" data-field="name_en" value="${esc(r.name_en)}"></label>
 <label>사업 단계<input type="text" data-field="_stage" value="${esc(r._stage)}"></label>
 <div class="badges">${Object.entries(badges).map(([k,v])=>`<label><input type="checkbox" data-badge="${k}" ${(r.badges||[]).includes(k)?'checked':''}>${v}</label>`).join('')}</div></div></details></div>
 <div class="location"><label class="caption">대상지<input type="text" list="geo-citylist" data-field="place" value="${esc(r.place)}" placeholder="확인한 지명 입력"></label><button type="button" data-open-map>지도에서 편집</button> <span class="hint">${r.coverage==='nationwide'?'전국 사업':r.coverage==='admin1'||r.coverage==='admin2'?'행정구역 사업':(!r.place?'비워 두면 핀 없이 표시':'')}</span></div></article>`}).join('')||'<div class="empty">해당하는 사업이 없습니다.</div>';
 if(currentLocation && shown.includes(currentLocation))activateLocation(currentLocation);else currentLocation=null;
 count();
}
$('rows').oninput=e=>{const t=e.target, row=rows.find(r=>r._key===Number(t.closest('article')?.dataset.key));if(!row)return;
 if(t.dataset.badge){row.badges=[...t.closest('.badges').querySelectorAll(':checked')].map(v=>v.dataset.badge)}
 else if(t.dataset.field){row[t.dataset.field]=t.type==='checkbox'?t.checked:t.value}
 if(t.dataset.field==='place')activateLocation(row,true);
 if(t.dataset.field==='selected'&&filter==='included')draw();else count();tell('');};
for(const event of ['focusin','click'])$('rows').addEventListener(event,e=>{
 if(e.target.matches('[data-field=place], [data-open-map]'))activateLocation(rows.find(r=>r._key===Number(e.target.closest('article').dataset.key)));
});
document.querySelector('.filters').onclick=e=>{if(!e.target.dataset.filter)return;filter=e.target.dataset.filter;draw()};
$('search').oninput=draw;$('add').onclick=()=>{rows.unshift({_key:++seq,_added:true,id:'manual:'+crypto.randomUUID(),selected:true,place:'',_originalPlace:'',name_ko:'',name_en:'',badges:[]});filter='all';$('search').value='';draw();document.querySelector('[data-field=name_ko]').focus()};
$('load').onclick=()=>$('restore').click();$('restore').onchange=async e=>{try{const f=e.target.files[0];if(f){const next=JSON.parse(await f.text());if(next.country!==data.country||String(next.year??'')!==String(data.year??''))throw Error('같은 국가·연도의 저장 목록을 선택하세요.');init(next);tell('저장 목록을 열었습니다.')}}catch(err){tell(err.message,true)}e.target.value=''};
function record(row){
 let {_key,_originalPlace,_geoEdit,...p}=row;p.name_ko=p.name_ko.trim();p.place=(p.place||'').trim();
 const period = p.name_ko.match(/[(（]\s*['‘’`]?((?:20)?\d{2})\s*[-–—~]\s*['‘’`]?((?:20)?\d{2})\s*[/／)）]/);
 if(period){const full=v=>v.length===2?'20'+v:v;if(!p._period_review)p._period=full(period[1])+'-'+full(period[2])}
 if(p.place!==_originalPlace){
 for(const k of ['sites','source_coord','geonames_locality','kind','aliases','coverage','place_en','admin1_names','admin2_names','admin1_name','admin2_name','scope_label','scope_label_en','_coord_source','_inferred_scope'])delete p[k];
 p._location_basis='manager-reviewed';
 }
 if(!p.place){p.coverage='unknown';p.scope_label='사업 범위 확인 필요'}
 applyLocation(p,_geoEdit);
 if(p._notice_candidate)p._review_decision=p.selected?'accepted':'not_selected';
 return p;
}
$('save').onclick=async()=>{
 const all=rows.map(record), picked=all.filter(r=>r.selected);
 if(picked.some(p=>!p.name_ko)){tell('포함한 사업의 국문 사업명을 입력하세요.',true);return}
 const result={...data,country_en:$('cen').value.trim(),region:$('reg').value.trim(),projects:picked,review_excluded:all.filter(p=>!p.selected),reviewed_at:new Date().toISOString()};delete result.notice_candidates;
 try{if(HOSTED){$('save').disabled=true;const resp=await fetch('/save'+location.search,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(result)});if(!resp.ok)throw Error('저장하지 못했습니다. 다시 시도하세요.');tell('목록을 저장했습니다. 이 창을 닫아도 됩니다.');}
 else{const u=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=`${data.country}-${data.year||'사업'}-검토.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);tell('선택 목록을 다운로드했습니다.')}}
 catch(err){tell(err.message,true);$('save').disabled=false}
};
__LOCATION_JS__
init(JSON.parse($('payload').textContent));
</script></body></html>
