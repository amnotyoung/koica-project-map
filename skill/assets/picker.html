<!doctype html><meta charset="utf-8">
<title>프로젝트맵 — 사업 선택</title>
<style>
  :root { --line:#e2e0dd; --navy:#004a8f; --muted:#6b7280; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 "Apple SD Gothic Neo","맑은 고딕",sans-serif; color:#231f20;
         background:#f7f6f4; }
  header { position:sticky; top:0; z-index:9; background:#fff; border-bottom:1px solid var(--line);
           padding:14px 20px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; }
  .meta { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .meta label { font-size:12px; color:var(--muted); }
  .meta input { padding:5px 8px; border:1px solid var(--line); border-radius:5px; font:inherit; }
  .grow { flex:1 }
  button { font:inherit; padding:7px 14px; border-radius:6px; border:1px solid var(--line);
           background:#fff; cursor:pointer; }
  button.primary { background:var(--navy); color:#fff; border-color:var(--navy); font-weight:700; }
  button:disabled { opacity:.5; cursor:default; }
  .count { font-size:13px; color:var(--muted); }
  main { padding:16px 20px 80px; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); }
  th, td { border-bottom:1px solid var(--line); padding:7px 8px; vertical-align:top; text-align:left; }
  th { background:#faf9f8; font-size:12px; color:var(--muted); font-weight:600;
       position:sticky; top:57px; z-index:8; }
  tr.off { background:#fbfbfa; color:#9ca3af; }
  tr.off input, tr.off select { color:#9ca3af; }
  .del { display:block; margin-top:6px; width:22px; height:22px; padding:0; line-height:1;
         border:1px solid #f0c5c5; background:#fff; color:#c0392b; border-radius:5px; cursor:pointer; }
  .del:hover { background:#c0392b; color:#fff; border-color:#c0392b; }
  input[type=text] { width:100%; padding:4px 6px; border:1px solid var(--line);
                     border-radius:4px; font:inherit; }
  td.nm input { font-size:13px; }
  .hint { font-size:11px; color:var(--muted); margin-top:3px; }
  .badges { display:flex; gap:3px; }
  .badges label { display:inline-flex; align-items:center; gap:2px; font-size:11px;
                  border:1px solid var(--line); border-radius:4px; padding:2px 4px; cursor:pointer; }
  .badges input { margin:0 }
  .badges label.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  .warn { background:#fff8e6; border:1px solid #f0d9a0; border-radius:6px; padding:10px 12px;
          margin-bottom:14px; font-size:13px; }
  .done { display:none; text-align:center; padding:80px 20px; font-size:16px; }
</style>
<header>
  <h1>사업 선택 <span id="ctry"></span></h1>
  <div class="meta">
    <label>국가(영문) <input id="cen" size="12"></label>
    <label>지역 <input id="reg" size="10"></label>
  </div>
  <span class="grow"></span>
  <span class="count" id="cnt"></span>
  <button id="addRow">+ 직접 추가</button>
  <button class="primary" id="save">저장하고 지도 만들기</button>
</header>
<main>
  <div class="warn">
    <b>지명은 원본 데이터의 그룹 라벨에서 뽑은 추정값입니다.</b> 실제 대상지와 다를 수 있으니
    확인해 주세요 — 여러 곳이면 <code>/</code> 로 잇고(<code>카트만두/부트왈</code>),
    주·군 단위면 끝에 <code>주</code>·<code>지역</code>을 붙이면 지명 해석에 반영됩니다.
    국가 중심점 폴백 좌표는 사용하지 않고, 그 밖의 원천 좌표는 지명이 바뀌지 않을 때 사용합니다.
    마커는 행정단위와 무관하게 대상지 1곳이면 빨간 점, 2곳 이상이면 초록 원으로 표시됩니다.
  </div>
  <table>
    <thead><tr>
      <th style="width:34px"></th>
      <th style="width:170px">지명 (place)</th>
      <th style="width:150px">분야</th>
      <th>사업명 (국문 / 영문)</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<div class="done" id="done">저장했습니다. 이 창을 닫고 터미널로 돌아가세요.</div>
<script>
const DATA = window.__DRAFT__;
const BADGES = [["E","교육"],["H","보건"],["G","공공행정"],["A","농림수산"],["T","기술환경"]];
// 행마다 고정 id 를 준다. 인덱스로 참조하면 행을 지웠을 때 번호가 밀려
// 엉뚱한 행이 수정된다 (직접 추가 행 삭제 기능의 전제).
let _seq = 0;
const rows = DATA.projects.map(p => ({
  ...p,
  selected: p.selected !== false,
  _original_place: p.place,
  _rid: ++_seq
}));
const rowById = rid => rows.find(r => r._rid === rid);
document.getElementById('ctry').textContent = '— ' + DATA.country;
document.getElementById('cen').value = DATA.country_en || '';
document.getElementById('reg').value = DATA.region || '';

function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function money(v){ return v ? (v/1e8).toFixed(1) + '억' : ''; }
function coordHint(r){
  if (r.source_coord) return `원천 좌표 사용 · ${esc(r.source_coord.source)}`;
  if (r._coord_source === '국가(폴백)') return '국가 중심점 제외 · 지명에서 좌표 재해석';
  return '';
}
function updateCount(){
  document.getElementById('cnt').textContent =
    `${rows.filter(r=>r.selected).length} / ${rows.length} 건 선택`;
}

function render(){
  document.getElementById('rows').innerHTML = rows.map(r => `
    <tr class="${r.selected ? '' : 'off'}" data-rid="${r._rid}">
      <td><input type="checkbox" class="sel" ${r.selected ? 'checked' : ''}>
          ${r._added ? '<button class="del" title="이 행 삭제">✕</button>' : ''}</td>
      <td><input type="text" class="place" value="${esc(r.place)}">
          <div class="hint">${r._added ? '직접 추가' : esc(r._period||'')+' '+money(r._budget_krw)+' '+esc(r._aid||'')}</div>
          ${coordHint(r) ? `<div class="hint">${coordHint(r)}</div>` : ''}</td>
      <td><div class="badges">${BADGES.map(([k,ko]) => `
            <label class="${(r.badges||[]).includes(k)?'on':''}">
              <input type="checkbox" class="bg" data-k="${k}" ${(r.badges||[]).includes(k)?'checked':''}>${k}</label>`).join('')}</div>
          <div class="hint">${esc(r._sector||'')}</div></td>
      <td class="nm"><input type="text" class="ko" value="${esc(r.name_ko)}">
          <input type="text" class="en" value="${esc(r.name_en)}" placeholder="영문 사업명 (영문 슬라이드용)" style="margin-top:4px">
      </td>
    </tr>`).join('');
  updateCount();
}
function readRow(tr){
  const r = rowById(+tr.dataset.rid); if (!r) return;
  r.selected = tr.querySelector('.sel').checked;
  r.place = tr.querySelector('.place').value.trim();
  r.name_ko = tr.querySelector('.ko').value.trim();
  r.name_en = tr.querySelector('.en').value.trim();
  r.badges = [...tr.querySelectorAll('.bg')].filter(b=>b.checked).map(b=>b.dataset.k);
}
document.getElementById('rows').addEventListener('input', e => {
  const tr = e.target.closest('tr'); readRow(tr);
  if (e.target.classList.contains('sel')) tr.classList.toggle('off', !rowById(+tr.dataset.rid).selected);
  if (e.target.classList.contains('bg')) e.target.closest('label').classList.toggle('on', e.target.checked);
  updateCount();
});
document.getElementById('rows').addEventListener('click', e => {
  if (!e.target.classList.contains('del')) return;
  const tr = e.target.closest('tr'), rid = +tr.dataset.rid;
  const r = rowById(rid);
  if (r && (!r.name_ko.trim() || confirm('이 행을 삭제할까요?'))) {
    rows.splice(rows.indexOf(r), 1); render();
  }
});
document.getElementById('addRow').onclick = () => {
  rows.unshift({selected:true, place:'', badges:[], name_ko:'', name_en:'',
                _added:true, _rid:++_seq});
  render(); document.querySelector('#rows .place').focus();
};
document.getElementById('save').onclick = async () => {
  document.querySelectorAll('#rows tr').forEach(readRow);
  const picked = rows.filter(r => r.selected);
  if (!picked.length) { alert('선택된 사업이 없습니다.'); return; }
  const bad = picked.filter(r => !r.place || !r.name_ko);
  if (bad.length && !confirm(`지명 또는 사업명이 빈 항목이 ${bad.length}건 있습니다. 그대로 진행할까요?`)) return;
  document.getElementById('save').disabled = true;
  await fetch('/save', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      country: DATA.country,
      country_en: document.getElementById('cen').value.trim(),
      region: document.getElementById('reg').value.trim(),
      ...(DATA.map_bbox ? {map_bbox: DATA.map_bbox} : {}),
      ...(DATA.year ? {year: DATA.year} : {}),
      ...(DATA.source ? {source: DATA.source} : {}),
      ...(DATA.fetched_at ? {fetched_at: DATA.fetched_at} : {}),
      ...(DATA._note ? {_note: DATA._note} : {}),
      projects: picked.map(r => ({
        place: r.place, badges: r.badges, name_ko: r.name_ko,
        ...(r.name_en ? {name_en: r.name_en} : {}),
        ...(r.place === r._original_place && r.aliases ? {aliases: r.aliases} : {}),
        ...(r.place === r._original_place && r.kind ? {kind: r.kind} : {}),
        ...(r.place === r._original_place && r.place_en ? {place_en: r.place_en} : {}),
        ...(r.place === r._original_place && r.source_coord ? {source_coord: r.source_coord} : {})
      }))
    })});
  document.querySelector('header').style.display='none';
  document.querySelector('main').style.display='none';
  document.getElementById('done').style.display='block';
};
render();
</script>
