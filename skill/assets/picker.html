<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

header{background:var(--navy);color:#fff;border-bottom:5px solid #69aaac}header>div,main{max-width:1190px;margin:auto;padding:23px 28px}
header>div,.line,.tools,.filters,.actions,.sources{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}h1{font-size:26px;margin:2px 0;font-weight:750}
header small{color:#d1e3ec}button,select,input{font:inherit}button,select{cursor:pointer}button{border:1px solid #bccbd2;background:white;border-radius:6px;color:var(--ink);padding:7px 13px}
button:hover{background:var(--tint)}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #2392b1;outline-offset:1px}.primary{background:#fff;color:var(--navy);font-weight:750}
.tools{margin:17px 0}.filters{gap:0;border:1px solid #bccbd2;border-radius:6px;overflow:hidden}.filters button{border:0;border-radius:0}.filters button[aria-pressed=true]{color:white;background:var(--navy)}

.tag,.hint,label.caption,summary,.extra label{font-size:12px;color:var(--muted)}.tag{color:var(--notice);font-weight:700}.sources{gap:9px;font-size:13px;margin-top:6px}a{color:#125775}.hint{margin:4px 0}.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}.badges label{font-size:12px;cursor:pointer}.badges input{accent-color:var(--navy)}details{margin-top:6px}summary{cursor:pointer}.extra{background:#f6f8f9;padding:10px;border-radius:5px;margin-top:5px}.extra input{margin-bottom:6px}
label.caption{display:block;margin-bottom:4px}.empty{padding:32px;text-align:center;color:var(--muted)}#feedback{margin-left:8px}#feedback.error{color:#a23419}#restore{display:none}footer{margin:13px 0 40px;color:var(--muted);font-size:13px}.sub{font-size:12px;color:var(--muted)}
@media(max-width:720px){main,header>div{padding:15px}.row{grid-template-columns:62px 1fr;gap:10px}.location{grid-column:2}.tools{align-items:stretch}.filters button{padding:6px 8px}h1{font-size:21px}}

#location-panel{grid-column:1/-1;border:1px solid #c5d6d9;border-radius:7px;padding:12px;background:#f6faf9}
#location-controls{display:grid;grid-template-columns:minmax(220px,2fr) minmax(160px,1fr);gap:12px}
#location-controls[hidden],#location-panel[hidden]{display:none}
#geo-map{width:100%;height:clamp(220px,31vh,340px);display:block;background:#e7eff0;touch-action:none;cursor:crosshair}
#geo-map .boundary{stroke:#98b0af;stroke-width:.65;vector-effect:non-scaling-stroke;fill:transparent}

.pin.representative circle:last-of-type{fill:#fff1cd;stroke:#995814;stroke-dasharray:3 2}.coordinate-fields{display:flex;align-items:end;gap:5px;flex-wrap:wrap}.coordinate-fields input{width:8em;font:inherit}.coordinate-fields button{font-size:13px}.map-tools button:disabled{opacity:.45;cursor:default}
</style></head>
<body><header><div><div><small>KOICA 프로젝트맵</small><h1 id="heading"></h1></div><span class="grow"></span><label class="lang-control">지도 언어 <select id="languages"><option value="ko">국문</option><option value="en">영문</option><option value="ko,en">국문·영문</option></select></label><span id="count"></span><button class="primary" id="save"></button></div></header>

<button type="button" id="coord-apply">좌표 미리보기</button></div><span id="coord-error" role="alert"></span></div>
<div id="area-controls" hidden><input type="search" id="region-filter" placeholder="행정구역 검색" aria-label="행정구역 검색"><label>권역<select id="region-options" size="5"></select></label></div>
<small id="geo-year"></small></div></div><p id="geo-status" role="status"></p><div class="map-tools"><button id="geo-confirm">위치 확정</button><button id="geo-cancel">변경 취소</button><button id="geo-undo">확정 되돌리기</button></div>

<label class="caption">확인 근거 (선택)<input type="text" id="geo-evidence" placeholder="현장 확인 메모 또는 근거 문서"></label><small>지도 자료 · Natural Earth · GeoNames · geoBoundaries</small></section></div>

<script>
const HOSTED=__HOSTED__, $=id=>document.getElementById(id);
let data, rows, filter='all', seq=0;
function languages(){return $('languages').value.split(',')}
const badges={E:'교육',H:'보건',G:'공공행정',A:'농림수산',T:'기술환경'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function webUrl(value){try{const u=new URL(value);return ['http:','https:'].includes(u.protocol)?u.href:null}catch{return null}}
function tell(msg,error=false){$('feedback').textContent=msg;$('feedback').className=error?'error':''}
function init(doc){
 if(!doc || typeof doc.country!=='string'||!Array.isArray(doc.projects))throw Error('국가와 사업 목록이 있는 JSON 파일을 선택하세요.');
 let entries=[...doc.projects,...(doc.period_candidates||[]).map(p=>({...p,selected:false})),...(doc.notice_candidates||[]).map(p=>({...p,selected:false})),...(doc.review_excluded||[]).map(p=>({...p,selected:false}))];
 if(entries.some(p=>!p||typeof p.name_ko!=='string'))throw Error('사업명이 없는 레코드를 읽을 수 없습니다.');
 currentLocation=null;data=doc;rows=entries.map(p=>({...p,selected:p.selected!==false,_key:++seq,_editingNames:new Set()}));filter=doc.notice_candidates?.length?'notice':'all';$('search').value='';
 for(const row of rows){
  if(row._similar_project&&!row._similar_project_id)row._similar_project_id=rows.find(p=>!p._notice_candidate&&p.name_ko===row._similar_project)?.id;
 }
 const preferred=doc.map_languages||['ko'];$('languages').value=preferred.length===2?'ko,en':preferred[0];
 $('heading').textContent=[doc.country,doc.year,'사업 목록 검토'].filter(Boolean).join(' ');$('cen').value=doc.country_en||'';$('reg').value=doc.region||'';
 const s=doc.notice_search;const boardUrl=webUrl(s?.search_url);$('official').hidden=!boardUrl;if(boardUrl)$('official').href=boardUrl;const n=rows.filter(r=>r._notice_candidate).length;
 $('lookup').hidden=!s;
 $('status').textContent=s?`${(s.checked_at||'').slice(0,10)} · 게시판 ${s.pages}쪽 · 후보 ${n}건${s.limited?' · 일부 검색':''}`:'';
 const issue=s?.status==='failed'?'공고 조회 실패':s?.status==='partial'?'공고 일부 조회 실패':'';
 $('issue').textContent=[issue,s?.stale?'이전 조회 결과 사용':''].filter(Boolean).join(' · ');$('issue').hidden=!$('issue').textContent;
 $('save').textContent=HOSTED?'__SAVE_LABEL__':'목록 저장';
 draw();
}
function count(){const n=rows.filter(r=>r.selected).length;$('count').textContent=`포함 ${n}건`;if(HOSTED)$('save').disabled=!n;for(const b of document.querySelectorAll('[data-filter]'))b.setAttribute('aria-pressed',b.dataset.filter===filter)}
function draw(){
 const panel=$('location-panel');$('geo-dock').append(panel);panel.hidden=true;
 const q=$('search').value.trim().toLowerCase();
 const shown=rows.filter(r=>(filter==='all'||filter==='notice'&&r._notice_candidate||filter==='included'&&r.selected)&&(!q||[r.name_ko,r.name_en,r.place,r.display_place_en,r.place_en,r._notice_title].join(' ').toLowerCase().includes(q)));
 $('rows').innerHTML=shown.map(r=>{
 const links=[...new Set([...(r.scope_sources||[]),r._source_info?.url].map(webUrl).filter(Boolean))];
 const lang=languages(), english=lang.includes('en'), korean=lang.includes('ko');
 const inputName=(key,label)=>showName(key,label,r);
 const link=(u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${i?'출처 '+(i+1):r._notice_candidate?'공고 원문':'출처'} ↗</a>`;
 return `<article class="row" data-key="${r._key}"><div><label class="toggle"><input type="checkbox" data-field="selected" ${r._duplicate_decision==='linked'?'disabled':''} ${r.selected?'checked':''}>포함</label>${r._period_candidate?'<span class="tag">기간 확인</span>':r._notice_candidate&&filter!=='notice'?'<span class="tag">공고 후보</span>':''}</div>
 <div>${korean?inputName('name_ko',english?'국문 사업명':'사업명'):''}${english?inputName('name_en','영문 사업명'):''}
 ${english&&!r.name_en&&r.name_ko?`<div class="hint">${esc(r.name_ko)}</div>`:''}
 <div data-period-slot>${periodControl(r)}</div>${duplicateControl(r)}
 <div class="sources">${links.length?link(links[0],0):''}${r._detail_unavailable?'본문 조회 실패':r._notice_candidate&&!r._period?'기간 확인 필요':''}</div>
 <details><summary>상세</summary><div class="extra">
 ${r._notice_title?`<p class="hint">${esc(r._notice_title)}</p>`:''}${r._notice_evidence?`<p class="hint">${esc(r._notice_evidence)}</p>`:''}
 ${links.slice(1).map((u,i)=>link(u,i+1)).join(' ')}
 <label>사업 단계<input type="text" data-field="_stage" value="${esc(r._stage)}"></label>
 <div class="badges">${Object.entries(badges).map(([k,v])=>`<label><input type="checkbox" data-badge="${k}" ${(r.badges||[]).includes(k)?'checked':''}>${v}</label>`).join('')}</div></div></details></div>
 <div class="location"><label class="caption">대상지<input type="text" list="geo-citylist" data-field="place" value="${esc(geoSessions.has(r)?geoState(r).place:r.place)}"></label>
 ${english?`<label class="caption">영문 지명 <span data-en-mode>${r.display_place_en?'수동':'자동'}</span><input type="text" data-field="display_place_en" value="${esc(r.display_place_en||'')}" placeholder="${esc(r.place_en||r.scope_label_en||'자동 표기')}"></label>`:''}
 <button type="button" data-open-map>지도에서 편집</button></div></article>`}).join('')||'<div class="empty">해당하는 사업이 없습니다.</div>';
 if(currentLocation && shown.includes(currentLocation))activateLocation(currentLocation);else currentLocation=null;
 count();
}
$('rows').oninput=e=>{const t=e.target, row=rows.find(r=>r._key===Number(t.closest('article')?.dataset.key));if(!row)return;
 if(t.hasAttribute('data-period')){choosePeriod(row,t.value);return}
 if(t.dataset.field==='place'){activateLocation(row,t.value);return}
 if(t.dataset.badge){row.badges=[...t.closest('.badges').querySelectorAll(':checked')].map(v=>v.dataset.badge)}
 else if(t.dataset.field){
  row[t.dataset.field]=t.type==='checkbox'?t.checked:t.value;
  if(t.dataset.field==='display_place_en')t.closest('label').querySelector('[data-en-mode]').textContent=t.value?'수동':'자동';
  if(t.dataset.field==='name_ko'){
   if(row._editor_period&&periodOptions(row).named!==row._editor_period.title)delete row._editor_period;
   t.closest('article').querySelector('[data-period-slot]').innerHTML=periodControl(row);
  }
 }
 if(t.dataset.field==='selected'&&filter==='included')draw();else count();tell('');};
$('rows').addEventListener('click',e=>{
 const btn=e.target.closest('button');if(!btn)return;
 const row=rows.find(r=>r._key===Number(btn.closest('article')?.dataset.key));if(!row)return;
 if(btn.dataset.duplicate){decideDuplicate(row,btn.dataset.duplicate);return}
 if(btn.dataset.editName){row._editingNames.add(btn.dataset.editName);draw();document.querySelector(`[data-key="${row._key}"] [data-field="${btn.dataset.editName}"]`).focus()}
 if(btn.dataset.nameDone){row._editingNames.delete(btn.dataset.nameDone);draw()}
});
for(const event of ['focusin','click'])$('rows').addEventListener(event,e=>{
 if(e.target.matches('[data-field=place], [data-open-map]'))activateLocation(rows.find(r=>r._key===Number(e.target.closest('article').dataset.key)));
});
$('languages').onchange=()=>{tell('');draw()};
document.querySelector('.filters').onclick=e=>{if(!e.target.dataset.filter)return;filter=e.target.dataset.filter;draw()};
$('search').oninput=draw;$('add').onclick=()=>{rows.unshift({_key:++seq,_added:true,id:'manual:'+crypto.randomUUID(),selected:true,place:'',_editingNames:new Set(),name_ko:'',name_en:'',badges:[]});filter='all';$('search').value='';draw();document.querySelector('[data-field=name_ko], [data-field=name_en]').focus()};
$('load').onclick=()=>$('restore').click();$('restore').onchange=async e=>{try{const f=e.target.files[0];if(f){const next=JSON.parse(await f.text());if(next.country!==data.country||String(next.year??'')!==String(data.year??''))throw Error('같은 국가·연도의 저장 목록을 선택하세요.');init(next);tell('저장 목록을 열었습니다.')}}catch(err){tell(err.message,true)}e.target.value=''};
function record(row){
 const {_key,_editingNames,...p}=row;
 if(p._added&&!p.place){p.coverage='unknown';p.scope_label='사업 범위 확인 필요'}
 if(p._notice_candidate)p._review_decision=p._duplicate_decision==='linked'?'linked':p.selected?'accepted':'not_selected';
 return p;
}
$('save').onclick=async()=>{
 const pending=rows.find(pendingGeo);
 if(pending){
  filter='all';$('search').value='';draw();activateLocation(pending);$('geo-confirm').focus();tell('위치 변경을 확정하거나 취소하세요.',true);return
 }
 const all=rows.map(record);attachLinkedNotices(all);const picked=all.filter(r=>r.selected);
 for(const lang of languages()){
  const key='name_'+lang, bad=rows.find(r=>r.selected&&!r[key]?.trim());
  if(bad){filter='included';$('search').value='';draw();const field=document.querySelector(`[data-key="${bad._key}"] [data-field="${key}"]`);field.setAttribute('aria-invalid','true');field.focus();tell((lang==='en'?'영문':'국문')+' 사업명을 입력하세요.',true);return}
 }
 const result={...data,map_languages:languages(),country_en:$('cen').value.trim(),region:$('reg').value.trim(),projects:picked,review_excluded:all.filter(p=>!p.selected),reviewed_at:new Date().toISOString()};delete result.notice_candidates;delete result.period_candidates;
 try{if(HOSTED){$('save').disabled=true;const resp=await fetch('/save'+location.search,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(result)});if(!resp.ok)throw Error('저장하지 못했습니다. 다시 시도하세요.');tell('저장했습니다.');}
 else{const u=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=`${data.country}-${data.year||'사업'}-검토.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);tell('다운로드했습니다.')}}
 catch(err){tell(err.message,true);$('save').disabled=false}
};

</script></body></html>
