name: Validate dependency automation secrets

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'codex/dependency-update-automation'
    runs-on: ubuntu-latest
    steps:
      - name: Require configured secrets
        env:
          READ_TOKEN: ${{ secrets.DEPENDENCY_READ_TOKEN }}
          PR_TOKEN: ${{ secrets.DEPENDENCY_PR_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.DEPENDENCY_DISPATCH_TOKEN }}
        run: |
          test -n "$READ_TOKEN"
          test -n "$PR_TOKEN"
          test -n "$DISPATCH_TOKEN"

      - name: Validate consumer repository access
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.DEPENDENCY_PR_TOKEN }}
          persist-credentials: false

      - name: Validate oda-map-lab read access
        uses: actions/checkout@v6
        with:
          repository: amnotyoung/oda-map-lab
          token: ${{ secrets.DEPENDENCY_READ_TOKEN }}
          path: .token-validation/oda-map-lab
          persist-credentials: false

      - name: Validate consumer write permissions
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_PR_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$REPOSITORY/dispatches" \
            -f event_type=token-validation
          gh api --method PATCH "repos/$REPOSITORY/pulls/$PR_NUMBER" \
            -f "title=$PR_TITLE" >/dev/null

      - name: Validate country-report-skill dispatch access
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_DISPATCH_TOKEN }}
        run: |
          gh api --method POST \
            repos/amnotyoung/country-report-skill/dispatches \
            -f event_type=token-validation
